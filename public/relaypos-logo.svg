<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="relayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>
    <filter id="relayGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Canvas -->
  <rect width="400" height="400" rx="80" fill="#090e17" />
  <rect width="396" height="396" x="2" y="2" rx="78" fill="none" stroke="url(#relayGrad)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Background Ambient Glow -->
  <circle cx="200" cy="200" r="120" fill="url(#glowGrad)" filter="url(#relayGlow)" opacity="0.15" />

  <!-- Estafet / Relay Loop Path (Dynamic Infinity-R Symbolism) -->
  <!-- Track 1: Back Curve -->
  <path d="M 120 280 L 120 120 C 120 80, 200 70, 240 110 C 275 145, 260 200, 200 200 L 120 200" 
        fill="none" 
        stroke="url(#relayGrad)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Track 2: The Relay Leg / Baton Forward Pass -->
  <path d="M 190 200 L 280 290" 
        fill="none" 
        stroke="url(#relayGrad)" 
        stroke-width="24" 
        stroke-linecap="round" />

  <!-- Dynamic Baton Capsule in Motion (Center Angle) -->
  <g transform="rotate(-35 235 245)">
    <rect x="205" y="235" width="60" height="20" rx="10" fill="#ffffff" filter="url(#relayGlow)" />
    <rect x="207" y="237" width="56" height="16" rx="8" fill="url(#relayGrad)" />
  </g>

  <!-- The 4 Workflow Nodes (Check-in Key, Slot Bay, Cafe Table, Car Release) -->
  <!-- Node 1: Key Intake (Top Left) -->
  <circle cx="120" cy="120" r="16" fill="#090e17" stroke="#10b981" stroke-width="6" />
  <circle cx="120" cy="120" r="6" fill="#ffffff" />

  <!-- Node 2: Slot Bay (Top Arc) -->
  <circle cx="240" cy="110" r="14" fill="#090e17" stroke="#06b6d4" stroke-width="5" />
  <circle cx="240" cy="110" r="5" fill="#ffffff" />

  <!-- Node 3: Cafe / Table Order (Center Hub) -->
  <circle cx="200" cy="200" r="18" fill="#090e17" stroke="#38bdf8" stroke-width="6" />
  <circle cx="200" cy="200" r="7" fill="#ffffff" />

  <!-- Node 4: Final Hand-off / Checkout (Bottom Right Exit) -->
  <circle cx="280" cy="290" r="16" fill="#090e17" stroke="#10b981" stroke-width="6" />
  <circle cx="280" cy="290" r="6" fill="#34d399" />

  <!-- Node 5: Queue Origin (Bottom Left Base) -->
  <circle cx="120" cy="280" r="14" fill="#090e17" stroke="#06b6d4" stroke-width="5" />
  <circle cx="120" cy="280" r="5" fill="#38bdf8" />
</svg>
